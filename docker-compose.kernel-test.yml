version: "3.8"

services:
  wg2vless-kernel-test:
    build: .
    image: wg2vless:kernel-test
    container_name: wg2vless-kernel-test
    restart: unless-stopped

    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun

    ports:
      - "51823:51823/udp"

    environment:
      # Use a separate test port, subnet, volume, and WireGuard profile.
      WG_BACKEND: "kernel"
      WG_PORT: "51823"
      WG_ENDPOINT: "your-test-endpoint"
      WG_SERVER_IP: "10.77.77.1"
      WG_CLIENT_IP: "10.77.77.2"
      WG_SUBNET_CIDR: "10.77.77.0/24"
      WG_MTU: "1420"
      WG_DNS: "1.1.1.1,8.8.8.8"
      WG_ALLOWED_IPS: "0.0.0.0/0"
      WG_PEER_ALLOWED_IPS: "10.77.77.2/32"

      # TProxy settings are kept inside the container namespace.
      WG_INTERFACE: "wg0"
      TPROXY_PORT: "12345"
      KERNEL_DNS_BYPASS: "1"

      # VLESS side: use either VLESS_URL or split vars.
      VLESS_HOST: "1.2.3.4"
      VLESS_PORT: "443"
      VLESS_UUID: "11111111-2222-3333-4444-555555555555"
      VLESS_SECURITY: "reality"
      VLESS_SNI: "yahoo.com"
      VLESS_PBK: "abcdefghijklmnopqrstuvwxyz0123456789"
      VLESS_SID: "cee8f80a"
      VLESS_FP: "chrome"
      VLESS_FLOW: "xtls-rprx-vision"
      VLESS_PACKET_ENCODING: "xudp"
      VLESS_TRANSPORT: "tcp"

      XRAY_LOGLEVEL: "warning"
      DATA_DIR: "/data"

    volumes:
      - ./data-kernel-test:/data:Z
